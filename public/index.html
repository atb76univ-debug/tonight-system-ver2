<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="apple-mobile-web-app-title" content="管理用">
  <title>tonight! 管理</title>
  <link rel="stylesheet" href="style.css?v=member-timetable-identical-v52">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/png" href="TMPlogo.png">
</head>
<body>
  <header class="topbar">
    <button type="button" id="backBtn" class="icon-btn hidden" aria-label="前の画面に戻る">←</button>
    <div class="header-main"><h1 id="pageTitle">tonight!</h1></div>
    <span id="headerLive" class="header-live hidden"><i></i><span>LIVE</span></span>
    <button type="button" id="scheduleSwitchBtn" class="schedule-switch-btn hidden">シフト</button>
    <button type="button" id="eventHomeBtn" class="event-home-btn hidden" aria-label="イベントホームへ移動">⌂ <span>イベントホーム</span></button><span id="sync" class="sync-state"></span>
    <section id="eventPulse" class="event-pulse hidden" aria-live="polite">
    <div class="event-pulse-top"><div class="event-pulse-controls"><span class="event-pulse-hint">20秒ごとに更新</span><button type="button" id="pulseCompactBtn" class="pulse-control" aria-label="表示サイズ切替">縮小</button><button type="button" id="pulseCollapseBtn" class="pulse-control" aria-expanded="true">しまう</button></div></div>
    <div id="globalNowBox"></div>
  </section>
  </header>
  <main id="app"></main>
  <div id="modalRoot"></div>
  <script>
    // ヘッダー高さをCSS変数に反映（iPadのステータスバー分・折り返し時でも NOW/NEXT がヘッダーに重ならない）
    (() => {
      const bar = document.querySelector(".topbar");
      const set = () => document.documentElement.style.setProperty("--topbar-h", bar.offsetHeight + "px");
      if (window.ResizeObserver) new ResizeObserver(set).observe(bar);
      window.addEventListener("resize", set);
      window.addEventListener("orientationchange", set);
      set();
    })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="app.js?v=result-roster-v49"></script>
</body>
</html>
